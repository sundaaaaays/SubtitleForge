<svg xmlns="http://www.w3.org/2000/svg" width="680" height="218" viewBox="0 0 680 218" role="img">
<title>五个识别参数分别作用在转写管线的哪一环</title>
<desc>语言作用于识别阶段，环境作用于语音检测阶段，单条字数、单条时长、静音断句作用于断句切分阶段。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<g>
<rect x="40" y="44" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="66" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#444441">解码</text>
<text x="100" y="84" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">转 16kHz</text>
</g>

<g>
<rect x="190" y="44" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="260" y="66" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#444441">语音检测</text>
<text x="260" y="84" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">VAD 找说话区间</text>
</g>

<g>
<rect x="360" y="44" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="420" y="66" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#444441">识别</text>
<text x="420" y="84" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">ASR 出文字</text>
</g>

<g>
<rect x="510" y="44" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="575" y="66" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#444441">断句切分</text>
<text x="575" y="84" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">切条目 + 时间轴</text>
</g>

<line x1="162" y1="72" x2="186" y2="72" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="332" y1="72" x2="356" y2="72" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="482" y1="72" x2="506" y2="72" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="260" y1="102" x2="260" y2="122" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="420" y1="102" x2="420" y2="122" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="575" y1="102" x2="575" y2="122" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>

<g>
<rect x="210" y="124" width="100" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="260" y="140" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#633806">环境</text>
</g>

<g>
<rect x="370" y="124" width="100" height="32" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="420" y="140" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#633806">语言</text>
</g>

<g>
<rect x="490" y="124" width="150" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="565" y="142" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#633806">单条字数 · 单条时长</text>
<text x="565" y="160" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#633806">静音断句</text>
</g>

<text x="40" y="198" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#5F5E5A">上面两个改的是「喂给模型的输入」，下面三个改的只是「文字怎么切」，不动识别结果本身</text>
</svg>
