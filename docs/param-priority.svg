<svg xmlns="http://www.w3.org/2000/svg" width="680" height="262" viewBox="0 0 680 262" role="img">
<title>断句时的五级优先级判定顺序</title>
<desc>依次判断句末标点、分号、静音间隔、字数超限、时长超限，先命中者即在此处切分。</desc>

<g>
<rect x="40" y="40" width="600" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="60" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#085041">1　句末标点 。！？</text>
<text x="620" y="60" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0F6E56">最优先，命中就切</text>
</g>

<g>
<rect x="40" y="88" width="600" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="60" y="108" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#085041">2　分号 ；</text>
<text x="620" y="108" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0F6E56">次优先</text>
</g>

<g>
<rect x="40" y="136" width="600" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="156" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#633806">3　静音 ≥ 静音断句阈值</text>
<text x="620" y="156" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#854F0B">且已累计 4 个字以上</text>
</g>

<g>
<rect x="40" y="184" width="600" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="204" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#633806">4　字数 &gt; 单条字数</text>
<text x="620" y="204" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#854F0B">先往后找句号，找不到才硬切</text>
</g>

<g>
<rect x="40" y="232" width="600" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="60" y="252" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#633806">5　时长 &gt; 单条时长</text>
<text x="620" y="252" text-anchor="end" dominant-baseline="central" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#854F0B">兜底，且要求字数已达上限八成</text>
</g>
</svg>
